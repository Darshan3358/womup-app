name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Which IPA to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - admin
          - rider
          - store
          - vendor

jobs:
  build-customer:
    if: inputs.target_app == 'all' || inputs.target_app == 'customer'
    name: Build Customer App IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Generate iOS Native Project (Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Patch Swift & Podfile
        run: node scripts/patch-expo-swift.js || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --no-repo-update || pod install

      - name: Build and Package IPA
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag{gsub(/^[[:space:]]+/,""); print; exit}')
          echo "Building Scheme: $SCHEME using Workspace: $WORKSPACE"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          APP_BUNDLE=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          cp -r "$APP_BUNDLE" Payload/
          zip -r "womup-customer.ipa" Payload

      - name: Upload Customer IPA
        uses: actions/upload-artifact@v4
        with:
          name: womup-customer-ipa
          path: womup-customer.ipa
          retention-days: 14

