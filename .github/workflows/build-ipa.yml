name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Which iOS App to build'
        required: true
        default: 'customer'
        type: choice
        options:
          - customer
          - admin
          - rider
          - store
          - all
      build_mode:
        description: 'Build method (macOS Runner or EAS Cloud)'
        required: true
        default: 'standalone_macos'
        type: choice
        options:
          - standalone_macos
          - eas_cloud
      export_method:
        description: 'Export method (ad-hoc, development, enterprise)'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - development
          - enterprise

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target_app }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  EXPO_USE_PRECOMPILED_MODULES: 0
  RCT_USE_PREBUILT_RNCORE: 0

jobs:
  # =========================================================================
  # 1. Customer App IPA
  # =========================================================================
  build-customer-ipa:
    if: inputs.target_app == 'customer' || inputs.target_app == 'all'
    name: Build Customer App IPA
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s "/Applications/Xcode.app"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
          xcodebuild -version
          xcrun simctl list devices > /dev/null 2>&1 || true

      - name: Install Project Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps
          node scripts/patch-expo-swift.js

      # -----------------------------------------------------------------
      # Optional: EAS Cloud Build path (if selected and EXPO_TOKEN exists)
      # -----------------------------------------------------------------
      - name: Build via EAS Cloud (if selected)
        if: inputs.build_mode == 'eas_cloud'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform ios --profile preview --non-interactive --wait --output=WormUp-Customer.ipa

      # -----------------------------------------------------------------
      # Standalone macOS Runner Build (Default)
      # -----------------------------------------------------------------
      - name: Setup Keychain & Certificates (if secrets provided)
        if: inputs.build_mode == 'standalone_macos' && env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROV_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD || 'buildpwd123' }}
        run: |
          echo "Setting up temporary build keychain..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import p12
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Install mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROV_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Generate iOS Native Project via Expo Prebuild
        if: inputs.build_mode == 'standalone_macos'
        run: |
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          node scripts/patch-expo-swift.js

      - name: Install CocoaPods
        if: inputs.build_mode == 'standalone_macos'
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          node scripts/patch-expo-swift.js
          cd ios
          pod install --repo-update

      - name: Build & Archive iOS Project
        if: inputs.build_mode == 'standalone_macos'
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace 2>/dev/null | head -n 1)
          APP_PROJECT=$(ls -d ios/*.xcodeproj 2>/dev/null | head -n 1)
          SCHEME=""
          if [ -n "$APP_PROJECT" ]; then
            SCHEME=$(basename "$APP_PROJECT" .xcodeproj)
          fi
          if [ -z "$SCHEME" ]; then
            SCHEME="WormUp"
          fi
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"
          mkdir -p build

          # Build archive
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/${SCHEME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        if: inputs.build_mode == 'standalone_macos'
        run: |
          mkdir -p build/ipa/Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "WormUp-Customer-Release.ipa" Payload
          ls -la WormUp-Customer-Release.ipa

      - name: Upload Customer App IPA
        uses: actions/upload-artifact@v4
        with:
          name: WormUp-Customer-iOS-IPA
          path: |
            build/ipa/WormUp-Customer-Release.ipa
            WormUp-Customer.ipa
          retention-days: 14

