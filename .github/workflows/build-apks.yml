name: Fast Build APKs

on:
  workflow_dispatch:
    inputs:
      target_app:
        description: 'Which APK to build'
        required: true
        default: 'both'
        type: choice
        options:
          - customer
          - admin
          - both

jobs:
  build-customer:
    if: inputs.target_app == 'customer' || inputs.target_app == 'both'
    name: Build Customer App APK
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Clean Gradle
        run: |
          cd android
          ./gradlew clean

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: WormUp-Customer-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  build-admin:
    if: inputs.target_app == 'admin' || inputs.target_app == 'both'
    name: Build Admin App APK
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Admin Dependencies
        run: |
          cd "Womup Admin"
          npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Admin Gradle Executable
        run: chmod +x "Womup Admin/android/gradlew"

      - name: Clean Admin Gradle
        run: |
          cd "Womup Admin/android"
          ./gradlew clean

      - name: Build Admin Release APK
        run: |
          cd "Womup Admin/android"
          ./gradlew assembleRelease --no-daemon

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: WormUp-Admin-Release-APK
          path: "Womup Admin/android/app/build/outputs/apk/release/*.apk"
          retention-days: 7
